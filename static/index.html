<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cloud Computing FAQ</title>
<style>
  :root {
    --bg: #f4f6fb;
    --panel: #ffffff;
    --text: #1b2333;
    --muted: #667085;
    --border: #e3e7ef;
    --accent: #2563eb;
    --accent-text: #ffffff;
    --accent-soft: #e8efff;
    --bot: #f1f4f9;
    --error: #b42318;
    --error-soft: #fdecea;
    --shadow: 0 10px 30px rgba(20, 32, 60, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1420;
      --panel: #161d2b;
      --text: #e6eaf2;
      --muted: #98a2b3;
      --border: #263043;
      --accent: #4f8cff;
      --accent-text: #0b1220;
      --accent-soft: #1d2a45;
      --bot: #1d2535;
      --error: #ff8a80;
      --error-soft: #3a1f22;
      --shadow: 0 10px 30px rgba(0, 0, 0, .35);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 760px;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: 16px;
    gap: 12px;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 4px 4px 0;
  }
  .logo {
    width: 40px; height: 40px; flex: none;
    border-radius: 12px;
    background: var(--accent);
    color: var(--accent-text);
    display: grid; place-items: center;
    font-weight: 700; font-size: 18px;
  }
  header h1 { margin: 0; font-size: 18px; line-height: 1.2; }
  header p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }

  .chat {
    flex: 1;
    min-height: 0;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 18px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    scroll-behavior: smooth;
  }
  .msg { display: flex; flex-direction: column; max-width: 85%; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.bot { align-self: flex-start; }
  .bubble {
    padding: 10px 14px;
    border-radius: 16px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .user .bubble {
    background: var(--accent);
    color: var(--accent-text);
    border-bottom-right-radius: 6px;
  }
  .bot .bubble {
    background: var(--bot);
    border-bottom-left-radius: 6px;
  }
  .bot.fallback .bubble { border: 1px dashed var(--border); background: transparent; }
  .bot.error .bubble { background: var(--error-soft); color: var(--error); }
  .meta {
    margin-top: 6px;
    font-size: 12px;
    color: var(--muted);
    display: flex; flex-wrap: wrap; gap: 4px 10px;
  }
  .meta .score {
    background: var(--accent-soft);
    color: var(--accent);
    border-radius: 999px;
    padding: 0 8px;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .chip {
    font: inherit; font-size: 13px;
    border: 1px solid var(--accent);
    background: transparent;
    color: var(--accent);
    border-radius: 999px;
    padding: 6px 12px;
    cursor: pointer;
    text-align: left;
    transition: background .15s, color .15s;
  }
  .chip:hover:not(:disabled) { background: var(--accent); color: var(--accent-text); }
  .chip:disabled { opacity: .45; cursor: default; }

  .typing .bubble { display: flex; gap: 5px; align-items: center; padding: 14px; }
  .typing span {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--muted);
    animation: blink 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

  form {
    display: flex;
    gap: 8px;
    padding: 12px;
    border-top: 1px solid var(--border);
  }
  input {
    flex: 1;
    min-width: 0;
    font: inherit;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 14px;
    outline: none;
  }
  input:focus { border-color: var(--accent); }
  button.send {
    font: inherit; font-weight: 600;
    border: 0;
    border-radius: 12px;
    padding: 0 18px;
    background: var(--accent);
    color: var(--accent-text);
    cursor: pointer;
  }
  button.send:disabled { opacity: .5; cursor: default; }
  footer { text-align: center; font-size: 12px; color: var(--muted); }
  @media (max-width: 520px) {
    .app { padding: 10px; }
    .msg { max-width: 92%; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo" aria-hidden="true">?</div>
    <div>
      <h1>Cloud Computing FAQ</h1>
      <p>Ask anything about the course lectures 01–09</p>
    </div>
  </header>

  <main class="chat">
    <div class="messages" id="messages" aria-live="polite"></div>
    <form id="form" autocomplete="off">
      <input id="input" maxlength="500" placeholder="Ask a question, e.g. What is sharding?" aria-label="Your question">
      <button class="send" id="send" type="submit">Send</button>
    </form>
  </main>

  <footer>Answers come from Azure AI Language · Custom Question Answering</footer>
</div>

<script>
  const SUGGESTIONS = [
    "What is sharding?",
    "How do we handle Black Friday traffic?",
    "What is a VNet?",
    "IaaS vs PaaS vs SaaS",
  ];

  const messagesEl = document.getElementById("messages");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");

  let lastQnaId = null;   // id of the last answer, sent as context
  let busy = false;

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;   // textContent, never innerHTML
    return e;
  }

  function scrollDown() { messagesEl.scrollTop = messagesEl.scrollHeight; }

  function addUser(text) {
    const m = el("div", "msg user");
    m.append(el("div", "bubble", text));
    messagesEl.append(m);
    scrollDown();
  }

  function addChips(parent, items, onClick) {
    const box = el("div", "chips");
    for (const item of items) {
      const b = el("button", "chip", item.text);
      b.type = "button";
      b.addEventListener("click", () => onClick(item));
      box.append(b);
    }
    parent.append(box);
  }

  function addBot(text, kind) {
    const m = el("div", "msg bot" + (kind ? " " + kind : ""));
    m.append(el("div", "bubble", text));
    messagesEl.append(m);
    scrollDown();
    return m;
  }

  function showTyping() {
    const m = el("div", "msg bot typing");
    const b = el("div", "bubble");
    b.append(el("span"), el("span"), el("span"));
    m.append(b);
    messagesEl.append(m);
    scrollDown();
    return m;
  }

  function setBusy(v) {
    busy = v;
    sendBtn.disabled = v;
    document.querySelectorAll(".chip").forEach(c => c.disabled = v);
  }

  function suggestionChips(parent) {
    addChips(parent, SUGGESTIONS.map(t => ({ text: t })), item => ask(item.text));
  }

  async function ask(question, qnaId) {
    if (busy) return;
    const text = (question || "").trim();
    if (!text && qnaId == null) return;

    addUser(text);
    setBusy(true);
    const typing = showTyping();

    const body = qnaId != null ? { qnaId, question: text } : { question: text };
    if (lastQnaId != null) body.previousQnaId = lastQnaId;

    try {
      const res = await fetch("/api/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const data = await res.json().catch(() => ({}));
      typing.remove();

      if (!res.ok) {
        const m = addBot(data.error || "Something went wrong. Please try again.", "error");
        addChips(m, [{ text: "Retry" }], () => ask(text, qnaId));
        return;
      }

      if (data.found) {
        lastQnaId = data.qnaId;
        const m = addBot(data.answer);
        const meta = el("div", "meta");
        if (data.source) meta.append(el("span", "", "Source: " + data.source.replace(/_/g, " ")));
        if (data.score != null) meta.append(el("span", "score", Math.round(data.score * 100) + "% match"));
        m.append(meta);
        if (data.prompts && data.prompts.length) {
          addChips(m, data.prompts, p => ask(p.text, p.qnaId));
        }
      } else {
        lastQnaId = null;
        const m = addBot(data.message, "fallback");
        suggestionChips(m);
      }
    } catch (err) {
      typing.remove();
      const m = addBot("Can't reach the server. Check your connection and try again.", "error");
      addChips(m, [{ text: "Retry" }], () => ask(text, qnaId));
    } finally {
      setBusy(false);
      scrollDown();
      input.focus();
    }
  }

  form.addEventListener("submit", e => {
    e.preventDefault();
    const q = input.value;
    input.value = "";
    ask(q);
  });

  // Welcome message
  const hello = addBot("Hi! I answer questions about the Cloud Computing course. Try one of these:");
  suggestionChips(hello);
  input.focus();
</script>
</body>
</html>
